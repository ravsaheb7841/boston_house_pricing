{% extends "base.html" %}
{% block content %}

<h2 class="text-center fw-bold">Model Performance</h2>

<div class="card p-4 shadow">

  <h4 class="fw-semibold mb-3">Predicted vs Actual</h4>
  <img src="/static/pred_vs_actual.png" class="img-fluid rounded mb-4 shadow-sm">

  <h4 class="fw-semibold">Metrics</h4>

  <ul class="list-group mt-2">
    {% for key, val in metrics.items() %}
      <li class="list-group-item d-flex justify-content-between">
        <strong>{{ key }}</strong>
        <span>{{ val }}</span>
      </li>
    {% endfor %}
  </ul>
</div>

<footer>
  © 2024 House Price Predictor | Developed by Ravsaheb
</footer>

{% endblock %}

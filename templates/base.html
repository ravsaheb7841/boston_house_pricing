<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f0f6ff;
      transition: background 0.4s, color 0.4s;
    }
    .dark-mode {
      background: #1a1a1a !important;
      color: white !important;
    }
    .dark-mode .card {
      background: #2b2b2b !important;
      color: white;
    }
    .dark-mode footer {
      background: #ffffff15 !important;
      color: #ddd !important;
    }
    footer {
      margin-top: 30px;
      text-align: center;
      padding: 12px;
      background: #00000020;
      border-radius: 10px;
      font-size: 14px;
    }
    .fade-in {
      animation: fadeIn 0.6s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Loading Spinner */
    #loadingSpinner {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9999;
    }
  </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">House Predictor</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/dataset">Dataset</a></li>
        <li class="nav-item"><a class="nav-link" href="/graphs">Graphs</a></li>
        <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
      </ul>

      <button class="btn btn-warning ms-3" onclick="toggleTheme()">Mode</button>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-4 fade-in">
  {% block content %}{% endblock %}
</div>

<!-- Loading Spinner -->
<div id="loadingSpinner">
  <div class="spinner-border text-primary" style="width:70px; height:70px;" role="status"></div>
</div>

<script>
function toggleTheme() {
    document.body.classList.toggle("dark-mode");
}

function showSpinner() {
    document.getElementById("loadingSpinner").style.display = "block";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
